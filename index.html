<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Aristocrat</title>
        <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2a4a7c;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
            color: #ffffff;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        .page-header {
            text-align: center;
            padding: 60px 20px;
            background: url('https://archive.org/download/cover1__w410/Обложка%20Библиотеки.png') center/cover no-repeat;
            background-attachment: fixed;
            border: 4px solid #ffffff;
            border-radius: 8px;
            margin: 20px 0;
            position: relative;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .page-header h1 {
            font-size: 2.5em;
            margin: 0;
            color: #ffffff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        .page-header p {
            font-size: 1.2em;
            color: #ffd700;
            margin: 10px 0 0 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Кнопка на главный сайт */
        .home-button-container {
            text-align: center;
            margin: 20px 0;
        }

        .home-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #0066b3, #0055a0);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .home-button:hover {
            transform: scale(1.05);
        }

        .programs-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(0,55,145,0.6) 0%, rgba(42,74,124,0.4) 100%);
            border: 3px solid #FFB347;
            border-radius: 8px;
            margin: 20px 0;
            flex-wrap: wrap;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 179, 71, 0.25);
        }

        .programs-bar:hover {
            background: linear-gradient(135deg, rgba(0,55,145,0.8) 0%, rgba(42,74,124,0.6) 100%);
            transform: translateY(-2px);
            border-color: #FF9F40;
            box-shadow: 0 4px 15px rgba(255, 159, 64, 0.5);
        }

        .programs-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            flex-grow: 1;
            justify-content: center;
        }

        .programs-link-text {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            transition: color 0.3s;
        }

        .programs-link:hover .programs-link-text {
            color: #ffffff;
        }

        .platform-icons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 50%, #0f0f23 100%);
            padding: 5px;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }

        .platform-icon:hover {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8), 0 0 40px rgba(255, 179, 71, 0.4);
        }

        .platform-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-tab {
            padding: 12px 30px;
            background-color: rgba(0, 55, 145, 0.5);
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-tab:hover { background-color: rgba(0, 55, 145, 0.8); }
        .nav-tab.active { background-color: #003791; color: #ffd700; }

        .search-container { margin: 20px 0; text-align: center; }
        .search-input {
            width: 100%; max-width: 600px;
            padding: 12px 20px; font-size: 16px;
            border: 3px solid #fff; border-radius: 4px;
            background-color: rgba(0,55,145,0.5); color: #fff;
            outline: none;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.7); }

        .filters {
            display: flex; gap: 15px;
            margin: 20px 0; flex-wrap: wrap;
            justify-content: center;
        }
        .filter-select {
            padding: 10px 15px; font-size: 14px;
            border: 2px solid #ffffff; border-radius: 4px;
            background-color: rgba(0,55,145,0.5); color: #ffffff;
            outline: none; cursor: pointer;
        }
        .filter-select option { background-color: #003791; color: #ffffff; }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .book-card {
            background-color: rgba(0, 55, 145, 0.4);
            border: 3px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .book-cover {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background-color: rgba(0,0,0,0.3);
            border-bottom: 3px solid #ffffff;
        }

        .book-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }

        .book-author {
            font-size: 13px;
            color: #ffffff;
            margin: 0 0 5px 0;
        }

        .book-series {
            font-size: 12px;
            color: #a0c4ff;
            margin: 0 0 8px 0;
            font-style: italic;
        }

        .book-description {
            font-size: 12px;
            color: #ffffff;
            margin: 0 0 10px 0;
            line-height: 1.4;
            flex-grow: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .download-label {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin: 0 0 8px 0;
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .book-formats {
            display: flex;
            gap: 6px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .format-btn {
            flex: 1;
            padding: 8px 5px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            color: #ffffff;
            transition: opacity 0.3s;
            min-width: 60px;
        }

        .format-btn:hover { opacity: 0.8; }
        .format-btn.epub { background-color: #28a745; }
        .format-btn.pdf { background-color: #dc3545; }
        .format-btn.audio { background-color: #ffc107; color: #000; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .pagination-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            background-color: rgba(0, 55, 145, 0.5);
            color: #ffffff;
            border: 3px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover {
            background-color: rgba(0, 55, 145, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .pagination-btn.active {
            background-color: #003791;
            color: #ffd700;
            border-color: #ffd700;
            cursor: default;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .pagination-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .pagination-info {
            color: #a0c4ff;
            font-size: 13px;
            margin-left: 10px;
        }

        .authors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .author-card {
            background-color: rgba(0, 55, 145, 0.4);
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .author-card:hover { transform: scale(1.05); }

        .author-photo {
            width: 150px; height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            border: 3px solid #ffd700;
            background-color: rgba(0,0,0,0.3);
        }

        .author-name {
            font-size: 16px; font-weight: bold;
            color: #ffd700; margin: 10px 0;
        }

        .author-books-count {
            font-size: 13px; color: #ffffff;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .series-card {
            background-color: rgba(0, 55, 145, 0.4);
            border: 3px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .series-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .series-covers-preview {
            position: relative;
            width: 100%;
            height: 130px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 10px;
            overflow: hidden;
        }

        .series-cover-thumb {
            position: absolute;
            width: 55px;
            height: 82px;
            object-fit: cover;
            border-radius: 3px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.4s ease;
        }

        .series-cover-thumb:nth-child(1) {
            transform: translateX(-40px) rotate(-10deg);
        }

        .series-cover-thumb:nth-child(2) {
            transform: translateX(0) rotate(0deg) scale(1.1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
        }

        .series-cover-thumb:nth-child(3) {
            transform: translateX(40px) rotate(10deg);
        }

        .series-card:hover .series-cover-thumb:nth-child(1) {
            transform: translateX(-50px) rotate(-15deg);
        }

        .series-card:hover .series-cover-thumb:nth-child(2) {
            transform: translateX(0) rotate(0deg) scale(1.15);
        }

        .series-card:hover .series-cover-thumb:nth-child(3) {
            transform: translateX(50px) rotate(15deg);
        }

        .series-cover-thumb.single {
            position: relative;
            width: 80px;
            height: 120px;
            transform: none !important;
        }

        .series-card:hover .series-cover-thumb.single {
            transform: scale(1.1) !important;
        }

        .series-cover-thumb.two-left {
            transform: translateX(-25px) rotate(-6deg);
        }

        .series-cover-thumb.two-right {
            transform: translateX(25px) rotate(6deg);
        }

        .series-card:hover .series-cover-thumb.two-left {
            transform: translateX(-35px) rotate(-10deg);
        }

        .series-card:hover .series-cover-thumb.two-right {
            transform: translateX(35px) rotate(10deg);
        }

        .series-name {
            font-size: 18px; font-weight: bold;
            color: #ffd700; margin: 0 0 10px 0;
        }

        .series-author { font-size: 14px; color: #ffffff; margin: 5px 0; }
        .series-books-count { font-size: 13px; color: #a0c4ff; margin-top: 10px; }

        .hidden { display: none; }

        .no-results {
            text-align: center; padding: 40px;
            font-size: 18px; color: #ffd700;
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            
            .page-header {
                padding: 40px 15px;
                background-attachment: scroll;
                background-size: cover;
                background-position: center 30%;
                min-height: 180px;
                margin: 15px 0;
            }
            
            .page-header h1 { font-size: 1.6em; }
            .page-header p { font-size: 0.9em; }
            
            .programs-bar {
                padding: 12px 15px;
                gap: 10px;
                margin: 15px 0;
            }
            
            .programs-link-text { font-size: 15px; }
            .platform-icon { width: 34px; height: 34px; }
            
            .nav-tabs { flex-direction: column; margin-bottom: 20px; }
            .nav-tab { width: 100%; padding: 10px 20px; font-size: 14px; }
            
            .search-input { max-width: 100%; padding: 10px 15px; font-size: 14px; }
            
            .filters { flex-direction: column; gap: 10px; }
            .filter-select { width: 100%; padding: 8px 12px; font-size: 13px; }
            
            .books-grid { 
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .book-info { padding: 12px; }
            .book-title { font-size: 14px; line-height: 1.2; }
            .book-author { font-size: 12px; }
            .book-series { font-size: 11px; }
            .book-description { 
                font-size: 11px; 
                -webkit-line-clamp: 2;
                margin-bottom: 8px;
            }
            
            .download-label { 
                font-size: 10px; 
                margin: 0 0 6px 0;
                padding: 4px 0;
            }
            
            .book-formats { gap: 4px; }
            .format-btn { padding: 6px 3px; font-size: 10px; min-width: auto; }
            
            .pagination { gap: 6px; margin: 20px 0; }
            .pagination-btn { 
                min-width: 36px; 
                height: 36px; 
                font-size: 13px;
                padding: 0 8px;
            }
            .pagination-info { 
                width: 100%; 
                text-align: center; 
                margin: 8px 0 0 0;
                font-size: 12px;
            }
            
            .authors-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .author-card { padding: 12px; }
            .author-photo { width: 100px; height: 100px; }
            .author-name { font-size: 13px; }
            .author-books-count { font-size: 11px; }
            
            .series-grid { grid-template-columns: 1fr; gap: 15px; }
            .series-card { padding: 15px; }
            .series-name { font-size: 15px; }
            .series-author { font-size: 12px; }
            .series-books-count { font-size: 11px; }
            
            .series-covers-preview {
                height: 110px;
            }
            
            .series-cover-thumb {
                width: 45px;
                height: 68px;
            }
            
            .series-cover-thumb:nth-child(1) {
                transform: translateX(-32px) rotate(-10deg);
            }
            
            .series-cover-thumb:nth-child(3) {
                transform: translateX(32px) rotate(10deg);
            }
        }

        @media (max-width: 480px) {
            .page-header {
                padding: 30px 10px;
                min-height: 150px;
            }
            
            .page-header h1 { font-size: 1.3em; }
            .page-header p { font-size: 0.85em; }
            
            .programs-bar {
                flex-direction: column;
                gap: 8px;
                padding: 10px;
                margin: 10px 0;
            }
            
            .programs-link {
                flex-direction: column;
                gap: 8px;
            }
            
            .programs-link-text { font-size: 14px; }
            .platform-icon { width: 32px; height: 32px; }
            
            .books-grid { 
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .book-info { padding: 8px; }
            .book-title { font-size: 12px; }
            .book-author { font-size: 10px; }
            .book-series { font-size: 9px; }
            .book-description { font-size: 9px; }
            
            .download-label { 
                font-size: 9px; 
                padding: 3px 0;
                margin: 0 0 4px 0;
            }
            
            .format-btn { padding: 4px 2px; font-size: 8px; }
            
            .pagination-btn { 
                min-width: 32px; 
                height: 32px; 
                font-size: 12px;
                padding: 0 6px;
            }
            
            .authors-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .author-photo { width: 80px; height: 80px; }
            .author-name { font-size: 12px; }
            
            .series-covers-preview {
                height: 90px;
            }
            
            .series-cover-thumb {
                width: 38px;
                height: 57px;
                border-width: 1.5px;
            }
            
            .series-cover-thumb:nth-child(1) {
                transform: translateX(-26px) rotate(-8deg);
            }
            
            .series-cover-thumb:nth-child(3) {
                transform: translateX(26px) rotate(8deg);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>📚 Библиотека Книг</h1>
        <p>«Бесплатный доступ к литературе: выбирайте формат по своему предпочтению.»</p>
    </div>

    <!-- Кнопка на главный сайт -->
    <div class="home-button-container">
        <a href="https://sites.google.com/view/aristocrat-inc" class="home-button">
            🏠 На главный сайт
        </a>
    </div>

    <div class="programs-bar">
        <a href="#" class="programs-link">
            <span class="programs-link-text">💾 Программы Для Книг</span>
            <div class="platform-icons">
                <div class="platform-icon android" title="Android">
                    <img src="https://archive.org/download/apple_202606/Android.png" alt="Android">
                </div>
                <div class="platform-icon apple" title="Apple">
                    <img src="https://archive.org/download/apple_202606/Apple.png" alt="Apple">
                </div>
                <div class="platform-icon pc" title="ПК">
                    <img src="https://archive.org/download/apple_202606/ПК.png" alt="ПК">
                </div>
            </div>
        </a>
    </div>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="showSection('books', this)">📖 Книги</div>
        <div class="nav-tab" onclick="showSection('authors', this)">️ Авторы</div>
        <div class="nav-tab" onclick="showSection('series', this)">📚 Серии</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по названию, автору или серии...">
    </div>

    <div class="filters" id="bookFilters">
        <select class="filter-select" id="formatFilter" onchange="filterBooks()">
            <option value="">Все форматы</option>
            <option value="epub">EPUB</option>
            <option value="pdf">PDF</option>
            <option value="audio">Аудиокниги</option>
        </select>
        <select class="filter-select" id="authorFilter" onchange="filterBooks()">
            <option value="">Все авторы</option>
        </select>
        <select class="filter-select" id="seriesFilter" onchange="filterBooks()">
            <option value="">Все серии</option>
            <option value="Без серии">Без серии</option>
        </select>
    </div>

    <div id="booksSection">
        <div class="books-grid" id="booksGrid"></div>
        <div class="no-results hidden" id="noBooksResults">😕 Книги не найдены</div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div id="authorsSection" class="hidden">
        <div class="authors-grid" id="authorsGrid"></div>
        <div class="no-results hidden" id="noAuthorsResults"> Авторы не найдены</div>
    </div>

    <div id="seriesSection" class="hidden">
        <div class="series-grid" id="seriesGrid"></div>
        <div class="no-results hidden" id="noSeriesResults">😕 Серии не найдены</div>
    </div>
</div>

<script src="books-data.js"></script>
<script>
const BOOKS_PER_PAGE = 15;
let currentPage = 1;
let currentFilteredBooks = [];
const booksData = BOOKS_DATA;
const authorsData = AUTHORS_DATA;
const seriesData = SERIES_DATA;

// Функция для получения полного имени (Издательство АСТ вместо АСТ)
function getFullDisplayName(name) {
    const publisher = PUBLISHERS_DATA.find(p => p.name === name);
    if (publisher && publisher.fullName) {
        return publisher.fullName;
    }
    return name;
}

function showSection(section, tab) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    
    document.getElementById('booksSection').classList.add('hidden');
    document.getElementById('authorsSection').classList.add('hidden');
    document.getElementById('seriesSection').classList.add('hidden');
    document.getElementById('bookFilters').classList.add('hidden');
    
    if (section === 'books') {
        document.getElementById('booksSection').classList.remove('hidden');
        document.getElementById('bookFilters').classList.remove('hidden');
    } else if (section === 'authors') {
        document.getElementById('authorsSection').classList.remove('hidden');
    } else if (section === 'series') {
        document.getElementById('seriesSection').classList.remove('hidden');
    }
    
    document.getElementById('searchInput').value = '';
    renderAll();
}

function renderBooks(books) {
    currentFilteredBooks = books;
    
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = '';
    
    if (books.length === 0) {
        document.getElementById('noBooksResults').classList.remove('hidden');
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    document.getElementById('noBooksResults').classList.add('hidden');
    
    const totalPages = Math.ceil(books.length / BOOKS_PER_PAGE);
    
    if (currentPage > totalPages) currentPage = 1;
    
    const startIndex = (currentPage - 1) * BOOKS_PER_PAGE;
    const endIndex = startIndex + BOOKS_PER_PAGE;
    const booksToShow = books.slice(startIndex, endIndex);
    
    booksToShow.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        
        let formatsHTML = '';
        if (book.formats.epub && book.formats.epub !== '#') {
            formatsHTML += `<a href="${book.formats.epub}" class="format-btn epub">EPUB</a>`;
        }
        if (book.formats.pdf && book.formats.pdf !== '#') {
            formatsHTML += `<a href="${book.formats.pdf}" class="format-btn pdf">PDF</a>`;
        }
        if (book.formats.audio && book.formats.audio !== '#') {
            formatsHTML += `<a href="${book.formats.audio}" class="format-btn audio">АУДИО</a>`;
        }
        
        if (!formatsHTML) {
            formatsHTML = '<span style="font-size: 11px; color: #a0c4ff; text-align: center; display: block; width: 100%;">Форматы недоступны</span>';
        }
        
        card.innerHTML = `
            <a href="book.html?id=${book.id}" style="text-decoration: none; color: inherit;">
                <img src="${book.cover}" alt="${book.title}" class="book-cover">
            </a>
            <div class="book-info">
                <h3 class="book-title"><a href="book.html?id=${book.id}" style="text-decoration: none; color: #ffd700;">${book.title}</a></h3>
                <p class="book-author">✍️ ${book.author}</p>
                ${book.series ? `<p class="book-series">📖 ${book.series}</p>` : ''}
                <p class="book-description">${book.description}</p>
                <div class="download-label">⬇️ Скачать</div>
                <div class="book-formats">${formatsHTML}</div>
            </div>
        `;
        grid.appendChild(card);
    });
    
    renderPagination(totalPages, books.length);
}

function renderPagination(totalPages, totalBooks) {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';
    
    if (totalPages <= 1) return;
    
    const prevBtn = document.createElement('div');
    prevBtn.className = 'pagination-btn' + (currentPage === 1 ? ' disabled' : '');
    prevBtn.innerHTML = '◀';
    prevBtn.title = 'Предыдущая страница';
    if (currentPage > 1) {
        prevBtn.onclick = () => goToPage(currentPage - 1);
    }
    pagination.appendChild(prevBtn);
    
    for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('div');
        pageBtn.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
        pageBtn.textContent = i;
        pageBtn.onclick = () => goToPage(i);
        pagination.appendChild(pageBtn);
    }
    
    const nextBtn = document.createElement('div');
    nextBtn.className = 'pagination-btn' + (currentPage === totalPages ? ' disabled' : '');
    nextBtn.innerHTML = '▶';
    nextBtn.title = 'Следующая страница';
    if (currentPage < totalPages) {
        nextBtn.onclick = () => goToPage(currentPage + 1);
    }
    pagination.appendChild(nextBtn);
    
    const info = document.createElement('div');
    info.className = 'pagination-info';
    const start = (currentPage - 1) * BOOKS_PER_PAGE + 1;
    const end = Math.min(currentPage * BOOKS_PER_PAGE, totalBooks);
    info.textContent = `Показано ${start}-${end} из ${totalBooks}`;
    pagination.appendChild(info);
}

function goToPage(page) {
    currentPage = page;
    renderBooks(currentFilteredBooks);
    document.getElementById('booksSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderAuthors(authors) {
    const grid = document.getElementById('authorsGrid');
    grid.innerHTML = '';
    
    if (authors.length === 0) {
        document.getElementById('noAuthorsResults').classList.remove('hidden');
        return;
    }
    document.getElementById('noAuthorsResults').classList.add('hidden');
    
    authors.forEach(author => {
        const booksCount = booksData.filter(b => b.author === author.name).length;
        const card = document.createElement('a');
        card.href = `author.html?name=${encodeURIComponent(author.name)}`;
        card.className = 'author-card';
        card.innerHTML = `
            <img src="${author.photo}" alt="${author.name}" class="author-photo">
            <h3 class="author-name">${author.name}</h3>
            <p class="author-books-count"> Книг: ${booksCount}</p>
            <p style="color: #ffd700; font-size: 11px; margin-top: 8px;">▶ Перейти на страницу</p>
        `;
        grid.appendChild(card);
    });
}

function renderSeries(series) {
    const grid = document.getElementById('seriesGrid');
    grid.innerHTML = '';
    
    if (series.length === 0) {
        document.getElementById('noSeriesResults').classList.remove('hidden');
        return;
    }
    document.getElementById('noSeriesResults').classList.add('hidden');
    
    series.forEach(s => {
        const seriesBooks = booksData.filter(b => b.series === s.name);
        const booksCount = seriesBooks.length;
        
        const card = document.createElement('a');
        card.href = `series.html?name=${encodeURIComponent(s.name)}`;
        card.className = 'series-card';
        
        let coversHTML = '';
        if (seriesBooks.length > 0) {
            const shuffled = [...seriesBooks].sort(() => 0.5 - Math.random());
            
            if (seriesBooks.length === 1) {
                coversHTML = `
                    <div class="series-covers-preview">
                        <img src="${shuffled[0].cover}" alt="${shuffled[0].title}" class="series-cover-thumb single" title="${shuffled[0].title}">
                    </div>
                `;
            } else if (seriesBooks.length === 2) {
                coversHTML = `
                    <div class="series-covers-preview">
                        <img src="${shuffled[0].cover}" alt="${shuffled[0].title}" class="series-cover-thumb two-left" title="${shuffled[0].title}">
                        <img src="${shuffled[1].cover}" alt="${shuffled[1].title}" class="series-cover-thumb two-right" title="${shuffled[1].title}">
                    </div>
                `;
            } else {
                const selected = shuffled.slice(0, 3);
                coversHTML = `
                    <div class="series-covers-preview">
                        <img src="${selected[0].cover}" alt="${selected[0].title}" class="series-cover-thumb" title="${selected[0].title}">
                        <img src="${selected[1].cover}" alt="${selected[1].title}" class="series-cover-thumb" title="${selected[1].title}">
                        <img src="${selected[2].cover}" alt="${selected[2].title}" class="series-cover-thumb" title="${selected[2].title}">
                    </div>
                `;
            }
        }
        
        // Используем getFullDisplayName для отображения "Издательство АСТ" вместо "АСТ"
        const displayAuthor = getFullDisplayName(s.author);
        
        card.innerHTML = `
            ${coversHTML}
            <h3 class="series-name">📖 ${s.name}</h3>
            <p class="series-author">✍️ ${displayAuthor}</p>
            <p class="series-books-count">📚 Книг в серии: ${booksCount}</p>
            <p style="color: #ffd700; font-size: 11px; margin-top: 8px;">▶ Перейти на страницу</p>
        `;
        grid.appendChild(card);
    });
}

function filterBooks() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const formatFilter = document.getElementById('formatFilter').value;
    const authorFilter = document.getElementById('authorFilter').value;
    const seriesFilter = document.getElementById('seriesFilter').value;
    
    let filtered = booksData.filter(book => {
        const matchesSearch = book.title.toLowerCase().includes(searchTerm) || 
                             book.author.toLowerCase().includes(searchTerm) ||
                             (book.series && book.series.toLowerCase().includes(searchTerm));
        const matchesFormat = !formatFilter || book.formats[formatFilter];
        const matchesAuthor = !authorFilter || book.author === authorFilter;
        const matchesSeries = !seriesFilter || 
                             (seriesFilter === 'Без серии' ? !book.series : book.series === seriesFilter);
        return matchesSearch && matchesFormat && matchesAuthor && matchesSeries;
    });
    
    currentPage = 1;
    renderBooks(filtered);
}

document.getElementById('searchInput').addEventListener('input', function() {
    const activeSection = document.querySelector('.nav-tab.active').textContent;
    
    if (activeSection.includes('Книги')) {
        filterBooks();
    } else if (activeSection.includes('Авторы')) {
        const searchTerm = this.value.toLowerCase();
        renderAuthors(authorsData.filter(a => a.name.toLowerCase().includes(searchTerm)));
    } else if (activeSection.includes('Серии')) {
        const searchTerm = this.value.toLowerCase();
        renderSeries(seriesData.filter(s => s.name.toLowerCase().includes(searchTerm)));
    }
});

function populateFilters() {
    const authorFilter = document.getElementById('authorFilter');
    const seriesFilter = document.getElementById('seriesFilter');
    
    [...new Set(booksData.map(b => b.author))].forEach(author => {
        const option = document.createElement('option');
        option.value = author;
        option.textContent = author;
        authorFilter.appendChild(option);
    });
    
    [...new Set(booksData.map(b => b.series).filter(s => s))].forEach(s => {
        const option = document.createElement('option');
        option.value = s;
        option.textContent = s;
        seriesFilter.appendChild(option);
    });
}

function renderAll() {
    currentPage = 1;
    renderBooks(booksData);
    renderAuthors(authorsData);
    renderSeries(seriesData);
}

populateFilters();
renderAll();
</script>
