<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автор - Библиотека</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2a4a7c;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
            color: #ffffff;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: rgba(0, 55, 145, 0.6);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 30px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .back-button:hover {
            background-color: rgba(0, 55, 145, 0.9);
            transform: translateX(-3px);
        }

        .author-header {
            display: flex;
            gap: 30px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0,55,145,0.6) 0%, rgba(42,74,124,0.4) 100%);
            border: 4px solid #ffffff;
            border-radius: 12px;
            margin-bottom: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .author-photo-large {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffd700;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .author-info {
            flex: 1;
            min-width: 280px;
        }

        .author-name-large {
            font-size: 2.5em;
            margin: 0 0 10px 0;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .author-years {
            font-size: 1.1em;
            color: #a0c4ff;
            margin-bottom: 15px;
            font-style: italic;
        }

        .author-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .stat-item {
            background-color: rgba(0, 55, 145, 0.5);
            padding: 10px 20px;
            border-radius: 4px;
            border: 2px solid #ffffff;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            color: #ffffff;
        }

        .biography {
            background: linear-gradient(135deg, rgba(0,55,145,0.4) 0%, rgba(42,74,124,0.3) 100%);
            border: 3px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .biography h2 {
            font-size: 1.8em;
            color: #ffd700;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .biography p {
            font-size: 1.05em;
            line-height: 1.8;
            margin: 0 0 15px 0;
            text-align: justify;
        }

        .books-section-title {
            text-align: center;
            font-size: 2em;
            color: #ffd700;
            margin: 30px 0 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background-color: rgba(0, 55, 145, 0.4);
            border: 3px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .book-cover-link {
            text-decoration: none;
            color: inherit;
        }

        .book-cover {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-bottom: 3px solid #ffffff;
        }

        .book-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin: 0 0 8px 0;
        }

        .book-title a {
            color: #ffd700;
            text-decoration: none;
        }

        .book-title a:hover {
            text-decoration: underline;
        }

        .book-series {
            font-size: 12px;
            color: #a0c4ff;
            margin: 0 0 8px 0;
            font-style: italic;
        }

        .book-series a {
            color: #a0c4ff;
            text-decoration: none;
        }

        .book-series a:hover {
            color: #ffd700;
        }

        .download-label {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin: 10px 0 8px 0;
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .book-formats {
            display: flex;
            gap: 6px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .format-btn {
            flex: 1;
            padding: 8px 5px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            color: #ffffff;
            transition: opacity 0.3s;
            min-width: 60px;
        }

        .format-btn:hover { opacity: 0.8; }
        .format-btn.epub { background-color: #28a745; }
        .format-btn.pdf { background-color: #dc3545; }
        .format-btn.audio { background-color: #ffc107; color: #000; }

        .error-message {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.5em;
            color: #ffd700;
        }

        .error-message h2 {
            margin-bottom: 30px;
        }

        .error-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: rgba(0, 55, 145, 0.6);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .error-button:hover {
            background-color: rgba(0, 55, 145, 0.9);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .author-header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }
            
            .author-photo-large {
                width: 150px;
                height: 150px;
            }
            
            .author-name-large {
                font-size: 1.8em;
            }
            
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .book-info { padding: 12px; }
            .book-title { font-size: 14px; }
            .book-series { font-size: 11px; }
            .format-btn { padding: 6px 3px; font-size: 10px; }
        }

        @media (max-width: 480px) {
            .author-photo-large {
                width: 120px;
                height: 120px;
            }
            
            .author-name-large {
                font-size: 1.4em;
            }
            
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .book-info { padding: 8px; }
            .book-title { font-size: 12px; }
            .book-series { font-size: 9px; }
            .format-btn { padding: 4px 2px; font-size: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-button" onclick="goBack(); return false;">← Вернуться в библиотеку</a>
    <div id="authorContainer"></div>
    <h2 class="books-section-title" id="booksTitle" style="display: none;">📚 Книги автора</h2>
    <div class="books-grid" id="booksGrid"></div>
</div>

<script src="books-data.js"></script>
<script>
// Исправленная функция для работы с URL
function getAuthorFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    let authorName = urlParams.get('name');
    
    if (!authorName) return null;
    
    // Декодируем URL и исправляем возможные проблемы с кодировкой
    try {
        authorName = decodeURIComponent(authorName);
    } catch (e) {
        console.error('Error decoding URL:', e);
    }
    
    return authorName.trim();
}

function goBack() {
    window.location.href = 'index.html';
}

const authorName = getAuthorFromURL();
const author = AUTHORS_DATA.find(a => a.name === authorName);

const container = document.getElementById('authorContainer');
const booksGrid = document.getElementById('booksGrid');
const booksTitle = document.getElementById('booksTitle');

if (author) {
    const authorBooks = BOOKS_DATA.filter(b => b.author === author.name);
    
    container.innerHTML = `
        <div class="author-header">
            <img src="${author.photo}" alt="${author.name}" class="author-photo-large">
            <div class="author-info">
                <h1 class="author-name-large">${author.name}</h1>
                <p class="author-years">${author.birth || ''} ${author.death ? '— ' + author.death : ''}</p>
                <div class="author-stats">
                    <div class="stat-item">
                        <span class="stat-number">${authorBooks.length}</span>
                        <span class="stat-label">📚 Книг</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${[...new Set(authorBooks.map(b => b.series))].filter(s => s).length}</span>
                        <span class="stat-label">📖 Серий</span>
                    </div>
                </div>
            </div>
        </div>
        
        ${author.biography ? `
        <div class="biography">
            <h2>📜 Биография</h2>
            ${author.biography.split('\n\n').map(p => `<p>${p}</p>`).join('')}
        </div>
        ` : ''}
    `;
    
    if (authorBooks.length > 0) {
        booksTitle.style.display = 'block';
        authorBooks.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            
            // Формируем кнопки скачивания
            let formatsHTML = '';
            if (book.formats.epub && book.formats.epub !== '#') {
                formatsHTML += `<a href="${book.formats.epub}" class="format-btn epub">EPUB</a>`;
            }
            if (book.formats.pdf && book.formats.pdf !== '#') {
                formatsHTML += `<a href="${book.formats.pdf}" class="format-btn pdf">PDF</a>`;
            }
            if (book.formats.audio && book.formats.audio !== '#') {
                formatsHTML += `<a href="${book.formats.audio}" class="format-btn audio">АУДИО</a>`;
            }
            
            if (!formatsHTML) {
                formatsHTML = '<span style="font-size: 11px; color: #a0c4ff; text-align: center; display: block; width: 100%;">Форматы недоступны</span>';
            }
            
            card.innerHTML = `
                <a href="book.html?id=${book.id}" class="book-cover-link">
                    <img src="${book.cover}" alt="${book.title}" class="book-cover">
                </a>
                <div class="book-info">
                    <h3 class="book-title"><a href="book.html?id=${book.id}">${book.title}</a></h3>
                    ${book.series ? `<p class="book-series">📖 <a href="series.html?name=${encodeURIComponent(book.series)}">${book.series}</a></p>` : ''}
                    <div class="download-label">⬇️ Скачать</div>
                    <div class="book-formats">${formatsHTML}</div>
                </div>
            `;
            booksGrid.appendChild(card);
        });
    }
    
    document.title = `${author.name} - Библиотека`;
} else {
    // Показываем улучшенное сообщение об ошибке
    container.innerHTML = `
        <div class="error-message">
            <h2>😕 Автор не найден</h2>
            <p style="font-size: 0.7em; margin: 20px 0; color: #a0c4ff;">
                ${authorName ? `Запрошенный автор: "${authorName}"` : 'Автор не указан в URL'}
            </p>
            <a href="index.html" class="error-button" onclick="goBack(); return false;">Вернуться в библиотеку</a>
        </div>
    `;
    document.title = 'Автор не найден - Библиотека';
}
</script>

</body>
</html>
