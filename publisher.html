<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Издательство - Библиотека</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #2a4a7c;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
            color: #ffffff;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: rgba(0, 55, 145, 0.6);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .back-button:hover {
            background-color: rgba(0, 55, 145, 0.9);
            transform: translateX(-3px);
        }

        .publisher-header {
            padding: 40px;
            background: linear-gradient(135deg, rgba(0,55,145,0.6) 0%, rgba(42,74,124,0.4) 100%);
            border: 4px solid #ffffff;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .publisher-logo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffd700;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            background-color: #ffffff;
            padding: 10px;
        }

        .publisher-name {
            font-size: 2.5em;
            margin: 0 0 15px 0;
            color: #ffd700;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .publisher-description {
            font-size: 1.1em;
            line-height: 1.8;
            max-width: 800px;
            margin: 20px auto;
            text-align: justify;
            color: #ffffff;
        }

        .publisher-stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat-item {
            background-color: rgba(0, 55, 145, 0.5);
            padding: 10px 20px;
            border-radius: 4px;
            border: 2px solid #ffffff;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            color: #ffffff;
        }

        .books-section-title {
            text-align: center;
            font-size: 2em;
            color: #ffd700;
            margin: 30px 0 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background-color: rgba(0, 55, 145, 0.4);
            border: 3px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .book-cover-link {
            text-decoration: none;
            color: inherit;
        }

        .book-cover {
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-bottom: 3px solid #ffffff;
        }

        .book-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin: 0 0 8px 0;
        }

        .book-title a {
            color: #ffd700;
            text-decoration: none;
        }

        .book-title a:hover {
            text-decoration: underline;
        }

        .book-author {
            font-size: 13px;
            color: #a0c4ff;
            margin: 0 0 8px 0;
            font-style: italic;
        }

        .book-author a {
            color: #a0c4ff;
            text-decoration: none;
        }

        .book-author a:hover {
            color: #ffd700;
        }

        .book-series {
            font-size: 12px;
            color: #a0c4ff;
            margin: 0 0 8px 0;
            font-style: italic;
        }

        .book-series a {
            color: #a0c4ff;
            text-decoration: none;
        }

        .book-series a:hover {
            color: #ffd700;
        }

        .download-label {
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin: 10px 0 8px 0;
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .book-formats {
            display: flex;
            gap: 6px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        .format-btn {
            flex: 1;
            padding: 8px 5px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            color: #ffffff;
            transition: opacity 0.3s;
            min-width: 60px;
        }

        .format-btn:hover { opacity: 0.8; }
        .format-btn.epub { background-color: #28a745; }
        .format-btn.pdf { background-color: #dc3545; }
        .format-btn.audio { background-color: #ffc107; color: #000; }

        .error-message {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.5em;
            color: #ffd700;
        }

        @media (max-width: 768px) {
            .publisher-header { padding: 20px; }
            .publisher-logo { width: 150px; height: 150px; }
            .publisher-name { font-size: 1.8em; }
            .books-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .publisher-logo { width: 120px; height: 120px; }
            .publisher-name { font-size: 1.4em; }
            .books-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .book-info { padding: 8px; }
            .book-title { font-size: 12px; }
            .book-author { font-size: 10px; }
            .format-btn { padding: 4px 2px; font-size: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-button">← Вернуться в библиотеку</a>
    <div id="publisherContainer"></div>
    <h2 class="books-section-title" id="booksTitle" style="display: none;">📚 Книги издательства</h2>
    <div class="books-grid" id="booksGrid"></div>
</div>

<script src="books-data.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const publisherName = decodeURIComponent(urlParams.get('name') || '');
const publisher = PUBLISHERS_DATA.find(p => p.name === publisherName || p.fullName === publisherName);

const container = document.getElementById('publisherContainer');
const booksGrid = document.getElementById('booksGrid');
const booksTitle = document.getElementById('booksTitle');

if (publisher) {
    const publisherBooks = BOOKS_DATA.filter(b => b.publisher === publisher.name);
    const uniqueAuthors = [...new Set(publisherBooks.map(b => b.author))];
    const uniqueSeries = [...new Set(publisherBooks.map(b => b.series).filter(s => s))];
    
    container.innerHTML = `
        <div class="publisher-header">
            <img src="${publisher.logo}" alt="${publisher.fullName || publisher.name}" class="publisher-logo">
            <h1 class="publisher-name">${publisher.fullName || publisher.name}</h1>
            <p class="publisher-description">${publisher.description}</p>
            <div class="publisher-stats">
                <div class="stat-item">
                    <span class="stat-number">${publisherBooks.length}</span>
                    <span class="stat-label">📚 Книг</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">${uniqueAuthors.length}</span>
                    <span class="stat-label">✍️ Авторов</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">${uniqueSeries.length}</span>
                    <span class="stat-label">📖 Серий</span>
                </div>
            </div>
        </div>
    `;
    
    if (publisherBooks.length > 0) {
        booksTitle.style.display = 'block';
        publisherBooks.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            
            let formatsHTML = '';
            if (book.formats.epub && book.formats.epub !== '#') {
                formatsHTML += `<a href="${book.formats.epub}" class="format-btn epub">EPUB</a>`;
            }
            if (book.formats.pdf && book.formats.pdf !== '#') {
                formatsHTML += `<a href="${book.formats.pdf}" class="format-btn pdf">PDF</a>`;
            }
            if (book.formats.audio && book.formats.audio !== '#') {
                formatsHTML += `<a href="${book.formats.audio}" class="format-btn audio">АУДИО</a>`;
            }
            
            if (!formatsHTML) {
                formatsHTML = '<span style="font-size: 11px; color: #a0c4ff; text-align: center; display: block; width: 100%;">Форматы недоступны</span>';
            }
            
            card.innerHTML = `
                <a href="book.html?id=${book.id}" class="book-cover-link">
                    <img src="${book.cover}" alt="${book.title}" class="book-cover">
                </a>
                <div class="book-info">
                    <h3 class="book-title"><a href="book.html?id=${book.id}">${book.title}</a></h3>
                    <p class="book-author">✍️ <a href="author.html?name=${encodeURIComponent(book.author)}">${book.author}</a></p>
                    ${book.series ? `<p class="book-series">📖 <a href="series.html?name=${encodeURIComponent(book.series)}">${book.series}</a></p>` : ''}
                    <div class="download-label">⬇️ Скачать</div>
                    <div class="book-formats">${formatsHTML}</div>
                </div>
            `;
            booksGrid.appendChild(card);
        });
    }
    
    document.title = `${publisher.fullName || publisher.name} - Библиотека`;
} else {
    container.innerHTML = `
        <div class="error-message">
            <h2> Издательство не найдено</h2>
            <a href="index.html" class="back-button">Вернуться в библиотеку</a>
        </div>
    `;
}
</script>

</body>
</html>
